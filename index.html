<title>Fußpflege Praxisbuch</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Praxisbuch">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#0f6e6e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
/* Layout: schmale Seitenleiste auf dem iPad, Tab-Leiste unten auf dem Telefon; Inhalt in einer Spalte mit Karten nur für Listen und Formulare. */
:root{
  --bg:#f4f6f6; --panel:#ffffff; --fg:#17272b; --muted:#5d7176; --line:#dbe3e4;
  --accent:#0f6e6e; --accent-fg:#ffffff; --accent-soft:#dff0ef;
  --good:#1d7a46; --warn:#a56200; --bad:#b3261e; --bad-soft:#fbe5e3; --warn-soft:#fbefd5; --good-soft:#dcf1e4;
  --radius:12px; --tap:46px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1719; --panel:#172326; --fg:#e8f0f0; --muted:#90a6aa; --line:#2a3b3f;
  --accent:#4fc0bb; --accent-fg:#052321; --accent-soft:#17383a;
  --good:#6fd39a; --warn:#f0b655; --bad:#ff8f86; --bad-soft:#412321; --warn-soft:#41330f; --good-soft:#173826; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1719; --panel:#172326; --fg:#e8f0f0; --muted:#90a6aa; --line:#2a3b3f;
  --accent:#4fc0bb; --accent-fg:#052321; --accent-soft:#17383a;
  --good:#6fd39a; --warn:#f0b655; --bad:#ff8f86; --bad-soft:#412321; --warn-soft:#41330f; --good-soft:#173826; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 var(--font);-webkit-text-size-adjust:100%;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
#app{display:flex;min-height:100%}
nav.side{width:210px;flex:none;background:var(--panel);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow:auto}
nav.side .brand{font-weight:700;font-size:17px;padding:4px 10px 14px;line-height:1.2}
nav.side .brand small{display:block;font-weight:400;color:var(--muted);font-size:12px;margin-top:2px}
nav.side button{display:flex;align-items:center;gap:10px;text-align:left;border:0;background:none;padding:12px 12px;border-radius:10px;min-height:var(--tap);cursor:pointer;color:var(--fg)}
nav.side button[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:650}
nav.side .grow{flex:1}
main{flex:1;min-width:0;max-width:980px;margin:0 auto;padding:22px max(16px,env(safe-area-inset-left,0px)) 90px max(16px,env(safe-area-inset-right,0px))}
h1{font-size:26px;margin:0 0 4px;letter-spacing:-.01em}
h2{font-size:18px;margin:26px 0 10px}
.sub{color:var(--muted);margin:0 0 18px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:14px 0}
.bar .spacer{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:var(--tap);padding:0 18px;border-radius:10px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-weight:600}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.small{min-height:38px;padding:0 12px;font-size:14px}
.btn:disabled{opacity:.5}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,nav button:focus-visible,.row:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.list{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.row{display:flex;gap:12px;align-items:center;padding:13px 16px;border-bottom:1px solid var(--line);min-height:56px;cursor:pointer}
.row:last-child{border-bottom:0}
.row .main{flex:1;min-width:0}
.row .t{font-weight:600;overflow-wrap:anywhere}
.row .s{color:var(--muted);font-size:14px;overflow-wrap:anywhere}
.row .amt{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.empty{padding:26px 16px;color:var(--muted);text-align:center}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12.5px;font-weight:650;background:var(--accent-soft);color:var(--accent)}
.pill.good{background:var(--good-soft);color:var(--good)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin:14px 0}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.stat .k{color:var(--muted);font-size:13.5px}.stat .v{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
form .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:14px;color:var(--muted);min-width:0}
label.f.wide{grid-column:1/-1}
label.f input,label.f select,label.f textarea{min-height:var(--tap);border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--bg);color:var(--fg);font-size:16px;width:100%;min-width:0}
label.f textarea{min-height:90px;resize:vertical}
label.chk{display:flex;gap:10px;align-items:center;min-height:var(--tap)}
label.chk input{width:22px;height:22px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:13px;color:var(--muted);font-weight:600}
td.r,th.r{text-align:right;white-space:nowrap}
.tot td{font-weight:700;border-top:2px solid var(--fg)}
.note{padding:12px 14px;border-radius:10px;background:var(--warn-soft);color:var(--fg);font-size:14.5px;margin:12px 0}
.note.ok{background:var(--good-soft)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:12px 18px;border-radius:12px;z-index:60;max-width:90vw}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--panel);width:min(640px,100%);max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px))}
@media(min-width:700px){.sheet-bg{align-items:center}.sheet{border-radius:18px}}
.lock{position:fixed;inset:0;background:var(--bg);z-index:80;display:flex;align-items:center;justify-content:center;padding:20px}
.lock .card{width:min(360px,100%);text-align:center}
.lock input{text-align:center;font-size:26px;letter-spacing:.4em;width:100%;min-height:56px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin:14px 0}
.tabs{display:none}
@media(max-width:820px){
  nav.side{display:none}
  .tabs{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);z-index:30;padding:6px max(6px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px))}
  .tabs button{flex:1;border:0;background:none;padding:8px 2px;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:52px;color:var(--muted);cursor:pointer}
  .tabs button[aria-current="page"]{color:var(--accent);font-weight:700}
  .tabs svg{width:22px;height:22px}
}
nav svg{width:20px;height:20px;flex:none}
/* Rechnungsansicht (Papier) */
.paper{background:#fff;color:#111;border:1px solid var(--line);border-radius:6px;padding:28px 30px;font-size:14px;line-height:1.4;max-width:800px;margin:0 auto}
.paper h3{margin:0;font-size:20px}.paper .row2{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}
.paper table th{color:#444;border-bottom:1px solid #999}.paper td{border-bottom:1px solid #ddd}
.paper .tot td{border-top:2px solid #111}
.paper small{color:#444}
@media print{
  body{background:#fff}nav,.tabs,.bar,.noprint,.toast{display:none!important}
  main{padding:0;max-width:none}.paper{border:0;padding:0}
  @page{margin:16mm}
}
</style>

<div id="app"></div>
<div id="layer"></div>

<script>
"use strict";
/* ---------- Hilfen ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const eur=n=>new Intl.NumberFormat("de-DE",{style:"currency",currency:"EUR"}).format(n||0);
const num=n=>new Intl.NumberFormat("de-DE",{minimumFractionDigits:2,maximumFractionDigits:2}).format(n||0);
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const dt=s=>s?s.split("-").reverse().join("."):"";
const r2=x=>Math.round((x+Number.EPSILON)*100)/100;
const pnum=v=>{const n=parseFloat(String(v??"").replace(",","."));return isNaN(n)?0:n};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const addDays=(s,n)=>{const d=new Date(s+"T12:00:00");d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
const icons={
 home:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
 users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-4 3.2-6 6.5-6s5.9 2 6.5 6"/><path d="M16 5a3.5 3.5 0 0 1 0 6.5M18 14c2 .6 3.3 2.4 3.6 6"/>',
 doc:'<path d="M6 3h8l5 5v13H6z"/><path d="M14 3v5h5M9 13h7M9 17h7"/>',
 tag:'<path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1.3"/>',
 wallet:'<rect x="3" y="6" width="18" height="14" rx="2"/><path d="M3 10h18M16 15h2"/>',
 chart:'<path d="M4 20V4M4 20h16M8 16v-5M13 16V8M18 16v-3"/>',
 gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>'
};
const ic=n=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icons[n]}</svg>`;

/* ---------- Daten ---------- */
const DEFAULT=()=>({v:1,
 praxis:{name:"Mobile Medizinische Fußpflege",inhaber:"J. Klehr-Jasmer",strasse:"",plz:"",ort:"",telefon:"",email:"",steuernr:"",bank:"",iban:"",bic:"",
  kleinunternehmer:true,ziel:14,fusszeile:"Vielen Dank für Ihr Vertrauen.",pinHash:""},
 leistungen:[
  {id:uid()+"a",bez:"Medizinische Fußpflege",preis:38,mwst:0,einheit:"Stück",aktiv:true},
  {id:uid()+"b",bez:"Diabetiker-Fußpflege",preis:42,mwst:0,einheit:"Stück",aktiv:true},
  {id:uid()+"c",bez:"Nagelspangen-Behandlung",preis:55,mwst:0,einheit:"Stück",aktiv:true},
  {id:uid()+"d",bez:"Nagelpilz-Behandlung",preis:40,mwst:0,einheit:"Stück",aktiv:true},
  {id:uid()+"e",bez:"Behandlung eingewachsener Nagel",preis:35,mwst:0,einheit:"Stück",aktiv:true},
  {id:uid()+"f",bez:"Anfahrtspauschale Hausbesuch",preis:8,mwst:0,einheit:"Stück",aktiv:true},
  {id:uid()+"g",bez:"Anfahrt je km",preis:1,mwst:0,einheit:"km",aktiv:true}],
 patienten:[],behandlungen:[],rechnungen:[],ausgaben:[]});
let DB=null, ui={view:"home",id:null,sub:null,filter:"offen",year:new Date().getFullYear(),q:""};

/* Speicher: IndexedDB, Rückfall localStorage */
const store={
  open(){return new Promise((res,rej)=>{try{const r=indexedDB.open("fusspflege-praxisbuch",1);r.onupgradeneeded=()=>r.result.createObjectStore("kv");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}})},
  async get(){try{const d=await this.open();return await new Promise((res,rej)=>{const q=d.transaction("kv").objectStore("kv").get("db");q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}catch(e){try{return JSON.parse(localStorage.getItem("fp-db")||"null")}catch(_){return null}}},
  async set(v){try{const d=await this.open();await new Promise((res,rej)=>{const t=d.transaction("kv","readwrite");t.objectStore("kv").put(v,"db");t.oncomplete=res;t.onerror=()=>rej(t.error)})}catch(e){try{localStorage.setItem("fp-db",JSON.stringify(v))}catch(_){toast("Speichern nicht möglich. Bitte Sicherung erstellen.")}}}
};
let saveT=null; const save=()=>{clearTimeout(saveT);saveT=setTimeout(()=>store.set(DB),150)};
const mutate=fn=>{fn(DB);save()};

/* ---------- Rechnen ---------- */
const posBrutto=p=>r2(pnum(p.menge)*pnum(p.preis)*(1-pnum(p.rabatt)/100));
const posMwst=p=>{const b=posBrutto(p),s=pnum(p.mwst);return r2(b*s/(100+s))};
const sums=r=>{let b=0,m=0;(r.pos||[]).forEach(p=>{b+=posBrutto(p);m+=posMwst(p)});return{brutto:r2(b),mwst:r2(m),netto:r2(b-m)}};
const faellig=r=>addDays(r.datum,r.ziel??14);
const status=r=>{if(r.storno)return["storniert","bad"];if(r.bezahlt)return["bezahlt","good"];return faellig(r)<today()?["überfällig","warn"]:["offen",""]};
const naechsteNr=(year)=>{const pre=year+"-";let mx=0;DB.rechnungen.forEach(r=>{if(r.nr.startsWith(pre))mx=Math.max(mx,parseInt(r.nr.slice(5))||0)});return pre+String(mx+1).padStart(3,"0")};
const pat=id=>DB.patienten.find(p=>p.id===id);
const patName=p=>p?[p.nachname,p.vorname].filter(Boolean).join(", "):"(gelöscht)";
const leist=id=>DB.leistungen.find(l=>l.id===id);

/* ---------- UI-Grundgerüst ---------- */
const NAV=[["home","Start","home"],["patienten","Patienten","users"],["rechnungen","Rechnungen","doc"],["preise","Preise","tag"],["ausgaben","Ausgaben","wallet"],["auswertung","Auswertung","chart"],["einstellungen","Einstellungen","gear"]];
const nav=(v,id=null,sub=null)=>{ui.view=v;ui.id=id;ui.sub=sub;render();window.scrollTo(0,0)};
function toast(t){document.querySelectorAll(".toast").forEach(x=>x.remove());const e=document.createElement("div");e.className="toast";e.setAttribute("role","status");e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2600)}
function render(){
  const cur=ui.view==="patient"?"patienten":ui.view==="rechnung"||ui.view==="beleg"?"rechnungen":ui.view;
  const side=NAV.map(([k,l,i])=>`<button data-go="${k}" ${cur===k?'aria-current="page"':""}>${ic(i)}${l}</button>`).join("");
  const tabs=NAV.filter(n=>n[0]!=="preise"&&n[0]!=="ausgaben").map(([k,l,i])=>`<button data-go="${k}" ${cur===k?'aria-current="page"':""}>${ic(i)}${l}</button>`).join("");
  $("#app").innerHTML=`<nav class="side" aria-label="Hauptmenü"><div class="brand">${esc(DB.praxis.name)}<small>Praxisbuch</small></div>${side}<div class="grow"></div></nav>
  <main id="main">${view()}</main><nav class="tabs" aria-label="Hauptmenü">${tabs}</nav>`;
}
function view(){switch(ui.view){
 case"home":return vHome();case"patienten":return vPatienten();case"patient":return vPatient();
 case"rechnungen":return vRechnungen();case"rechnung":return vRechnung();case"beleg":return vBeleg();
 case"preise":return vPreise();case"ausgaben":return vAusgaben();case"auswertung":return vAuswertung();case"einstellungen":return vEinst();}
 return""}

/* ---------- Start ---------- */
function vHome(){
  const y=new Date().getFullYear(),act=DB.rechnungen.filter(r=>!r.storno);
  const offen=act.filter(r=>!r.bezahlt),offSum=offen.reduce((a,r)=>a+sums(r).brutto,0);
  const ueb=offen.filter(r=>faellig(r)<today());
  const ums=act.filter(r=>r.bezahlt&&r.bezahlt.startsWith(y)).reduce((a,r)=>a+sums(r).brutto,0);
  const ausg=DB.ausgaben.filter(a=>a.datum.startsWith(y)).reduce((s,a)=>s+pnum(a.brutto),0);
  return `<h1>Guten Tag</h1><p class="sub">${new Date().toLocaleDateString("de-DE",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}</p>
  <div class="bar"><button class="btn primary" data-act="neuRechnung">Neue Rechnung</button><button class="btn" data-act="neuPatient">Neuer Patient</button></div>
  <div class="stats">
   <div class="stat"><div class="k">Offene Rechnungen</div><div class="v">${eur(offSum)}</div><div class="s">${offen.length} Stück${ueb.length?`, ${ueb.length} überfällig`:""}</div></div>
   <div class="stat"><div class="k">Eingenommen ${y}</div><div class="v">${eur(ums)}</div></div>
   <div class="stat"><div class="k">Ausgaben ${y}</div><div class="v">${eur(ausg)}</div></div>
   <div class="stat"><div class="k">Patienten</div><div class="v">${DB.patienten.length}</div></div></div>
  <h2>Offene Rechnungen</h2>${rechList(offen.sort((a,b)=>faellig(a)<faellig(b)?-1:1),"Alles bezahlt.")}
  ${DB.patienten.length===0?'<div class="note">Zum Start: Legen Sie unter „Patienten“ den ersten Patienten an und prüfen Sie unter „Preise“ Ihre Leistungen. Unter „Einstellungen“ tragen Sie Ihre Praxisdaten für die Rechnung ein.</div>':""}`}
function rechList(list,empty){
  if(!list.length)return `<div class="list"><div class="empty">${empty}</div></div>`;
  return `<div class="list">${list.map(r=>{const[s,c]=status(r);return `<div class="row" tabindex="0" data-go="rechnung" data-id="${r.id}">
   <div class="main"><div class="t">${esc(r.nr)} · ${esc(patName(pat(r.patient)))}</div><div class="s">${dt(r.datum)} · fällig ${dt(faellig(r))}</div></div>
   <span class="pill ${c}">${s}</span><div class="amt">${eur(sums(r).brutto)}</div></div>`}).join("")}</div>`}

/* ---------- Patienten ---------- */
function vPatienten(){
  const q=ui.q.toLowerCase();
  const l=DB.patienten.filter(p=>!q||(patName(p)+" "+(p.ort||"")+" "+(p.telefon||"")).toLowerCase().includes(q)).sort((a,b)=>patName(a).localeCompare(patName(b),"de"));
  return `<h1>Patienten</h1><p class="sub">${DB.patienten.length} Einträge</p>
  <div class="bar"><input id="q" type="search" placeholder="Suchen (Name, Ort, Telefon)" value="${esc(ui.q)}" style="flex:1;min-width:200px;min-height:var(--tap);border:1px solid var(--line);border-radius:10px;padding:0 12px;background:var(--panel)"><button class="btn primary" data-act="neuPatient">Neuer Patient</button></div>
  <div class="list">${l.length?l.map(p=>`<div class="row" tabindex="0" data-go="patient" data-id="${p.id}"><div class="main"><div class="t">${esc(patName(p))}</div><div class="s">${esc([p.strasse,[p.plz,p.ort].filter(Boolean).join(" ")].filter(Boolean).join(", "))}${p.telefon?" · "+esc(p.telefon):""}</div></div>${p.diabetes?'<span class="pill warn">Diabetes</span>':""}</div>`).join(""):'<div class="empty">Keine Patienten gefunden.</div>'}</div>`}
function patForm(p){p=p||{};const f=(l,n,t="text",x="")=>`<label class="f ${x}">${l}<input name="${n}" type="${t}" value="${esc(p[n]||"")}"></label>`;
  return `<form data-form="patient" data-id="${p.id||""}"><div class="grid">
  <label class="f">Anrede<select name="anrede">${["","Frau","Herr","Divers"].map(o=>`<option ${p.anrede===o?"selected":""}>${o}</option>`).join("")}</select></label>
  ${f("Vorname *","vorname")}${f("Nachname *","nachname")}${f("Geburtsdatum","geb","date")}
  ${f("Straße, Nr.","strasse","text","wide")}${f("PLZ","plz")}${f("Ort","ort")}${f("Telefon","telefon","tel")}${f("E-Mail","email","email")}
  ${f("Krankenkasse / Kostenträger","kasse","text","wide")}
  <label class="f wide">Hinweise (Allergien, Medikamente, Zugang)<textarea name="hinweis">${esc(p.hinweis||"")}</textarea></label>
  <label class="chk wide"><input type="checkbox" name="diabetes" ${p.diabetes?"checked":""}> Diabetes / Risikofuß</label>
  <label class="chk wide"><input type="checkbox" name="dsgvo" ${p.dsgvo?"checked":""}> Einwilligung zur Datenverarbeitung liegt vor</label>
  </div><div class="bar"><button class="btn primary" type="submit">Speichern</button><button class="btn" type="button" data-act="closeSheet">Abbrechen</button></div></form>`}
function vPatient(){
  const p=pat(ui.id);if(!p){return `<p>Patient nicht gefunden.</p><button class="btn" data-go="patienten">Zurück</button>`}

  ${r.pos.length?`<tr class="tot"><td colspan="3">Gesamtbetrag</td><td class="r">${num(s.brutto)}</td><td></td></tr>`:""}</tbody></table></div>

/* ---------- Auswertung ---------- */
function auswertung(y){
  const inc=DB.rechnungen.filter(r=>!r.storno&&r.bezahlt&&r.bezahlt.startsWith(String(y))).sort((a,b)=>a.bezahlt<b.bezahlt?-1:1);
  const out=DB.ausgaben.filter(a=>a.datum.startsWith(String(y))).sort((a,b)=>a.datum<b.datum?-1:1);
  const eB=r2(inc.reduce((s,r)=>s+sums(r).brutto,0)),eM=r2(inc.reduce((s,r)=>s+sums(r).mwst,0));
  const aB=r2(out.reduce((s,a)=>s+pnum(a.brutto),0)),aM=r2(out.reduce((s,a)=>s+r2(pnum(a.brutto)*pnum(a.mwst)/(100+pnum(a.mwst))),0));
  const mon=Array.from({length:12},(_,i)=>({m:i+1,e:0,a:0}));
  inc.forEach(r=>mon[+r.bezahlt.slice(5,7)-1].e+=sums(r).brutto);out.forEach(a=>mon[+a.datum.slice(5,7)-1].a+=pnum(a.brutto));
  const kat={};out.forEach(a=>kat[a.kat]=(kat[a.kat]||0)+pnum(a.brutto));
  return{inc,out,eB,eM,aB,aM,mon,kat,eN:r2(eB-eM),aN:r2(aB-aM)}}
function vAuswertung(){const y=ui.year,A=auswertung(y),ku=DB.praxis.kleinunternehmer;
  const ue=ku?r2(A.eB-A.aB):r2(A.eN-A.aN);
  const years=[...new Set([new Date().getFullYear(),...DB.rechnungen.map(r=>+r.datum.slice(0,4)),...DB.ausgaben.map(a=>+a.datum.slice(0,4))])].sort().reverse();
  const MN=["Jan","Feb","Mär","Apr","Mai","Jun","Jul","Aug","Sep","Okt","Nov","Dez"];
  return `<h1>Auswertung für das Finanzamt</h1><p class="sub">Einnahmen nach Zahlungsdatum, Ausgaben nach Belegdatum (Einnahmen-Überschuss-Rechnung).</p>
  <div class="bar"><label class="f" style="flex-direction:row;align-items:center;gap:10px">Jahr <select id="yr" style="min-height:var(--tap);border:1px solid var(--line);border-radius:10px;padding:0 12px;background:var(--panel)">${years.map(v=>`<option ${v===y?"selected":""}>${v}</option>`).join("")}</select></label><span class="spacer"></span><button class="btn" data-act="copyAusw">Zahlen kopieren</button><button class="btn" data-act="csvAusw">CSV speichern</button></div>
  <div class="stats"><div class="stat"><div class="k">Einnahmen</div><div class="v">${eur(ku?A.eB:A.eN)}</div></div><div class="stat"><div class="k">Ausgaben</div><div class="v">${eur(ku?A.aB:A.aN)}</div></div><div class="stat"><div class="k">Überschuss (Gewinn)</div><div class="v" style="color:${ue<0?"var(--bad)":"var(--good)"}">${eur(ue)}</div></div></div>
  ${ku?"":`<p class="sub">Beträge netto, ohne Umsatzsteuer. Brutto Einnahmen ${eur(A.eB)}, enthaltene Umsatzsteuer ${eur(A.eM)}; Ausgaben brutto ${eur(A.aB)}, Vorsteuer ${eur(A.aM)}.</p>`}
  <h2>Nach Monat</h2><div class="card tw"><table><thead><tr><th>Monat</th><th class="r">Einnahmen</th><th class="r">Ausgaben</th><th class="r">Saldo</th></tr></thead><tbody>${A.mon.map(m=>`<tr><td>${MN[m.m-1]}</td><td class="r">${num(m.e)}</td><td class="r">${num(m.a)}</td><td class="r">${num(r2(m.e-m.a))}</td></tr>`).join("")}<tr class="tot"><td>Summe</td><td class="r">${num(A.eB)}</td><td class="r">${num(A.aB)}</td><td class="r">${num(r2(A.eB-A.aB))}</td></tr></tbody></table></div>
  <h2>Ausgaben nach Kategorie</h2><div class="card tw"><table><tbody>${Object.keys(A.kat).length?Object.entries(A.kat).map(([k,v])=>`<tr><td>${esc(k)}</td><td class="r">${num(v)}</td></tr>`).join(""):'<tr><td class="empty">Keine Ausgaben.</td></tr>'}</tbody></table></div>
  <h2>Einzelnachweis Einnahmen</h2><div class="card tw"><table><thead><tr><th>Bezahlt am</th><th>Rechnung</th><th>Zahlart</th><th class="r">Betrag</th></tr></thead><tbody>${A.inc.map(r=>`<tr><td>${dt(r.bezahlt)}</td><td>${esc(r.nr)}</td><td>${esc(r.zahlart||"")}</td><td class="r">${num(sums(r).brutto)}</td></tr>`).join("")||'<tr><td colspan="4" class="empty">Keine Einnahmen.</td></tr>'}</tbody></table></div>`}
function csvAusw(){const A=auswertung(ui.year);const rows=[["Typ","Datum","Beleg","Beschreibung","Kategorie","Brutto"]];
  A.inc.forEach(r=>rows.push(["Einnahme",r.bezahlt,r.nr,"Rechnung",r.zahlart||"",num(sums(r).brutto)]));
  A.out.forEach(a=>rows.push(["Ausgabe",a.datum,a.beleg||"",a.beschr||"",a.kat,num(pnum(a.brutto))]));
  return rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(";")).join("\n")}

/* ---------- Einstellungen ---------- */
function vEinst(){const P=DB.praxis,f=(l,n,x="")=>`<label class="f ${x}">${l}<input name="${n}" value="${esc(P[n]||"")}"></label>`;
  return `<h1>Einstellungen</h1><p class="sub">Praxisdaten erscheinen auf jeder Rechnung.</p>
  <form data-form="praxis" class="card"><div class="grid">${f("Praxisname","name","wide")}${f("Inhaberin / Inhaber","inhaber")}${f("Straße, Nr.","strasse")}${f("PLZ","plz")}${f("Ort","ort")}${f("Telefon","telefon")}${f("E-Mail","email")}${f("Steuernummer","steuernr")}${f("Bank","bank")}${f("IBAN","iban")}${f("BIC","bic")}
  <label class="f">Zahlungsziel (Tage)<input name="ziel" inputmode="numeric" value="${P.ziel}"></label>
  <label class="f wide">Fußzeile auf der Rechnung<input name="fusszeile" value="${esc(P.fusszeile||"")}"></label>
  <label class="chk wide"><input type="checkbox" name="kleinunternehmer" ${P.kleinunternehmer?"checked":""}> Kleinunternehmerregelung (§ 19 UStG, keine Umsatzsteuer ausweisen)</label></div>
  <div class="bar"><button class="btn primary" type="submit">Speichern</button></div></form>
  <h2>Schutz mit Code</h2><div class="card"><p class="sub" style="margin-top:0">Patientendaten sind Gesundheitsdaten. Mit einem Code bleibt die App auch bei verlorenem, entsperrtem iPad geschlossen. Zusätzlich sollte das iPad selbst eine Code-Sperre haben.</p><div class="bar" style="margin:0">${P.pinHash?'<button class="btn" data-act="setPin">Code ändern</button><button class="btn danger" data-act="noPin">Code entfernen</button>':'<button class="btn primary" data-act="setPin">Code festlegen</button>'}${P.pinHash?'<button class="btn" data-act="lockNow">Jetzt sperren</button>':""}</div></div>
  <h2>Sicherung</h2><div class="card"><div class="note">Alle Daten liegen nur auf diesem iPad. Gehen Gerät oder Browserdaten verloren, sind sie weg. Bitte erstellen Sie regelmäßig eine Sicherung und legen Sie sie in iCloud Drive oder per E-Mail ab.${DB.lastBackup?`<br>Letzte Sicherung: ${new Date(DB.lastBackup).toLocaleString("de-DE")}`:"<br>Es wurde noch keine Sicherung erstellt."}</div>
  <div class="bar" style="margin-bottom:0"><button class="btn primary" data-act="backup">Sicherung erstellen</button><button class="btn" data-act="restore">Sicherung einspielen</button></div></div>
  <h2>Alle Daten löschen</h2><div class="bar"><button class="btn danger" data-act="wipe">Alle Daten löschen</button></div>`}

/* ---------- Sheets ---------- */
function sheet(html,title){$("#layer").innerHTML=`<div class="sheet-bg" data-act="bg"><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title||"")}"><h2 style="margin-top:0">${esc(title||"")}</h2>${html}</div></div>`;const f=$("#layer input:not([type=checkbox]):not([type=date]),#layer select");if(f&&matchMedia("(min-width:700px)").matches)f.focus()}
const closeSheet=()=>{$("#layer").innerHTML=""};
function confirmBox(text,ok,cb){sheet(`<p>${esc(text)}</p><div class="bar"><button class="btn danger" data-act="yes">${esc(ok)}</button><button class="btn" data-act="closeSheet">Abbrechen</button></div>`,"Bitte bestätigen");$("#layer").querySelector('[data-act="yes"]').onclick=()=>{closeSheet();cb()}}
function download(name,text,type){
  try{const b=new Blob([text],{type});const u=URL.createObjectURL(b);const a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}catch(e){}
  sheet(`<p class="sub">Falls kein Download startet (zum Beispiel in der Vorschau), kopieren Sie den Text und fügen ihn in eine Notiz oder E-Mail ein.</p><textarea id="dl" readonly style="width:100%;min-height:200px;font:13px monospace;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:10px">${esc(text)}</textarea><div class="bar"><button class="btn primary" data-act="copyDl">Alles kopieren</button><button class="btn" data-act="closeSheet">Schließen</button></div>`,name)}
async function copy(t){try{await navigator.clipboard.writeText(t);toast("Kopiert");return true}catch(e){const el=$("#dl");if(el){el.select();toast("Bitte markierten Text manuell kopieren")}else{toast("Kopieren nicht möglich")}return false}}

/* ---------- Ereignisse ---------- */
document.addEventListener("click",async e=>{
  const g=e.target.closest("[data-go]");if(g&&!e.target.closest("[data-act]")){const v=g.dataset.go;if(v==="rechnung"){const r=DB.rechnungen.find(x=>x.id===g.dataset.id)||draft;draft=JSON.parse(JSON.stringify(r));draft.neu=false}nav(v,g.dataset.id||null);return}
  const fl=e.target.closest("[data-filter]");if(fl){ui.filter=fl.dataset.filter;render();return}
  const a=e.target.closest("[data-act]");if(!a)return;const act=a.dataset.act,id=a.dataset.id;
  if(act==="bg"){if(e.target===a)closeSheet();return}
  switch(act){
  case"closeSheet":closeSheet();break;
  case"neuPatient":sheet(patForm(),"Neuer Patient");break;
  case"editPatient":sheet(patForm(pat(id)),"Patient bearbeiten");break;
  case"delPatient":confirmBox("Patient mit allen Behandlungen löschen? Zugehörige Rechnungen bleiben für die Buchhaltung erhalten.","Löschen",()=>{mutate(d=>{d.patienten=d.patienten.filter(p=>p.id!==id);d.behandlungen=d.behandlungen.filter(b=>b.patient!==id)});nav("patienten")});break;
  case"neuBeh":sheet(behForm(null,id),"Neue Behandlung");break;
  case"editBeh":{const b=DB.behandlungen.find(x=>x.id===id);sheet(behForm(b,b.patient),"Behandlung");break}
  case"delBeh":confirmBox("Behandlung löschen?","Löschen",()=>{mutate(d=>d.behandlungen=d.behandlungen.filter(b=>b.id!==id));render()});break;
  case"rechnungAusBeh":{draft=newRechnung(id,DB.behandlungen.filter(b=>b.patient===id&&!b.rechnung));nav("rechnung");break}
  case"neuRechnung":draft=newRechnung("");nav("rechnung");break;
  case"addPos":sheet(posForm(),"Position hinzufügen");break;
  case"editPos":{const i=+a.dataset.i;sheet(posForm(draft.pos[i],i),"Position ändern");break}
  case"delPos":draft.pos.splice(+a.dataset.i,1);closeSheet();render();break;
  case"beleg":if(!(await saveDraftFromForm()))break;nav("beleg");break;
  case"print":try{window.print()}catch(_){}toast("Falls kein Druckdialog erscheint: Safari-Menü „Teilen“ → „Drucken“");break;
  case"copyBeleg":copy(belegText());break;
  case"bezahlt":sheet(`<form data-form="paid"><div class="grid"><label class="f">Bezahlt am<input type="date" name="datum" value="${today()}" required></label><label class="f">Zahlungsart<select name="art">${["Überweisung","Bar","EC-Karte","PayPal"].map(o=>`<option>${o}</option>`).join("")}</select></label></div><div class="bar"><button class="btn primary" type="submit">Buchen</button><button class="btn" type="button" data-act="closeSheet">Abbrechen</button></div></form>`,"Zahlung buchen");break;
  case"unpaid":draft.bezahlt="";draft.zahlart="";persistDraft();render();break;
  case"storno":confirmBox("Rechnung stornieren? Sie zählt dann nicht mehr als Einnahme, die Nummer bleibt vergeben.","Stornieren",()=>{draft.storno=true;persistDraft();render()});break;
  case"neuLeist":sheet(leistForm(),"Neue Leistung");break;
  case"editLeist":sheet(leistForm(leist(id)),"Leistung bearbeiten");break;
  case"delLeist":confirmBox("Leistung löschen? Bereits geschriebene Rechnungen behalten ihre Positionen.","Löschen",()=>{mutate(d=>d.leistungen=d.leistungen.filter(l=>l.id!==id));render()});break;
  case"neuAusg":sheet(ausgForm(),"Ausgabe erfassen");break;
  case"editAusg":sheet(ausgForm(DB.ausgaben.find(x=>x.id===id)),"Ausgabe");break;
  case"delAusg":confirmBox("Ausgabe löschen?","Löschen",()=>{mutate(d=>d.ausgaben=d.ausgaben.filter(x=>x.id!==id));render()});break;
  case"copyAusw":{const A=auswertung(ui.year);copy(`Jahr ${ui.year}\nEinnahmen brutto: ${num(A.eB)} €\nAusgaben brutto: ${num(A.aB)} €\nÜberschuss: ${num(DB.praxis.kleinunternehmer?A.eB-A.aB:A.eN-A.aN)} €`);break}
  case"csvAusw":download(`Auswertung-${ui.year}.csv`,"﻿"+csvAusw(),"text/csv");break;
  case"copyDl":copy($("#dl").value);break;
  case"backup":DB.lastBackup=Date.now();save();download(`Praxisbuch-Sicherung-${today()}.json`,JSON.stringify(DB),"application/json");break;
  case"restore":sheet(`<p class="sub">Wählen Sie eine Sicherungsdatei oder fügen Sie deren Text ein. Die aktuellen Daten werden dabei ersetzt.</p><input type="file" id="rf" accept=".json,application/json" style="margin-bottom:10px"><textarea id="rt" placeholder="Oder Sicherungstext hier einfügen" style="width:100%;min-height:120px;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:10px"></textarea><div class="bar"><button class="btn primary" data-act="doRestore">Einspielen</button><button class="btn" data-act="closeSheet">Abbrechen</button></div>`,"Sicherung einspielen");break;
  case"doRestore":{let t=$("#rt").value.trim();const f=$("#rf").files[0];if(f)t=await f.text();try{const d=JSON.parse(t);if(!d.patienten||!d.rechnungen)throw 0;DB=d;await store.set(DB);closeSheet();nav("home");toast("Sicherung eingespielt")}catch(_){toast("Das ist keine gültige Sicherung")}break}
  case"wipe":confirmBox("Wirklich ALLE Daten löschen? Das kann nicht rückgängig gemacht werden. Erstellen Sie vorher eine Sicherung.","Alles löschen",async()=>{DB=DEFAULT();await store.set(DB);nav("home")});break;
  case"setPin":sheet(`<form data-form="pin"><label class="f">Neuer Code (4 bis 8 Ziffern)<input name="pin" inputmode="numeric" pattern="[0-9]{4,8}" autocomplete="off" required></label><div class="bar"><button class="btn primary" type="submit">Festlegen</button><button class="btn" type="button" data-act="closeSheet">Abbrechen</button></div></form>`,"Code festlegen");break;
  case"noPin":DB.praxis.pinHash="";save();render();toast("Code entfernt");break;
  case"lockNow":lock();break;
  }
});
document.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.classList?.contains("row")){e.preventDefault();e.target.click()}if(e.key==="Escape")closeSheet()});
document.addEventListener("input",e=>{if(e.target.id==="q"){ui.q=e.target.value;const pos=e.target.selectionStart;render();const q=$("#q");q.focus();q.setSelectionRange(pos,pos)}});
document.addEventListener("change",e=>{
  if(e.target.id==="yr"){ui.year=+e.target.value;render()}
  if(e.target.id==="posL"){const o=e.target.selectedOptions[0];if(o&&o.value){$("#posB").value=o.textContent;$("#posP").value=String(o.dataset.p).replace(".",",");$("#posM").value=String(o.dataset.m).replace(".",",")}}
});
function persistDraft(){const r=JSON.parse(JSON.stringify(draft));delete r.neu;mutate(d=>{const i=d.rechnungen.findIndex(x=>x.id===r.id);if(i>=0)d.rechnungen[i]=r;else d.rechnungen.push(r)})}
async function saveDraftFromForm(){const f=$('form[data-form="rechnung"]');if(!f||draft.bezahlt||draft.storno)return true;if(!f.reportValidity())return false;readRechnung(f);return commitRechnung()}
function readRechnung(f){const d=new FormData(f);if(d.has("patient"))draft.patient=d.get("patient")||draft.patient;if(d.get("datum"))draft.datum=d.get("datum");if(d.has("leistdat"))draft.leistdat=d.get("leistdat")||draft.leistdat;if(d.has("ziel"))draft.ziel=Math.max(0,parseInt(d.get("ziel"))||0);if(d.has("hinweis"))draft.hinweis=d.get("hinweis")||""}
function commitRechnung(){if(!draft.patient){toast("Bitte einen Patienten wählen");return false}if(!draft.pos.length){toast("Bitte mindestens eine Position hinzufügen");return false}
  if(draft.neu){draft.nr=naechsteNr(draft.datum.slice(0,4));}
  const beh=draft.beh||[];persistDraft();if(draft.neu){mutate(d=>d.behandlungen.forEach(b=>{if(beh.includes(b.id))b.rechnung=draft.id}));draft.neu=false}return true}
document.addEventListener("submit",async e=>{e.preventDefault();const f=e.target,k=f.dataset.form,d=Object.fromEntries(new FormData(f));
  if(k==="patient"){const id=f.dataset.id;mutate(db=>{const o={anrede:d.anrede,vorname:d.vorname.trim(),nachname:d.nachname.trim(),geb:d.geb,strasse:d.strasse,plz:d.plz,ort:d.ort,telefon:d.telefon,email:d.email,kasse:d.kasse,hinweis:d.hinweis,diabetes:!!d.diabetes,dsgvo:!!d.dsgvo};
    if(id){Object.assign(db.patienten.find(p=>p.id===id),o)}else{o.id=uid();db.patienten.push(o);ui.id=o.id}});closeSheet();if(id)render();else nav("patient",ui.id);toast("Gespeichert")}
  if(k==="beh"){const id=f.dataset.id,pid=f.dataset.pid;const leistIds=DB.leistungen.filter(l=>d["l_"+l.id]).map(l=>l.id);
    mutate(db=>{const o={datum:d.datum,km:d.km,leist:leistIds,notiz:d.notiz,patient:pid};if(id)Object.assign(db.behandlungen.find(b=>b.id===id),o);else{o.id=uid();db.behandlungen.push(o)}});closeSheet();render();toast("Gespeichert")}
  if(k==="leist"){const id=f.dataset.id;mutate(db=>{const o={bez:d.bez.trim(),preis:pnum(d.preis),einheit:d.einheit,mwst:pnum(d.mwst),aktiv:!!d.aktiv};if(id)Object.assign(db.leistungen.find(l=>l.id===id),o);else{o.id=uid();db.leistungen.push(o)}});closeSheet();render();toast("Gespeichert")}
  if(k==="ausg"){const id=f.dataset.id;mutate(db=>{const o={datum:d.datum,beleg:d.beleg,beschr:d.beschr,lief:d.lief,kat:d.kat,brutto:pnum(d.brutto),mwst:pnum(d.mwst)};if(id)Object.assign(db.ausgaben.find(a=>a.id===id),o);else{o.id=uid();db.ausgaben.push(o)}});closeSheet();render();toast("Gespeichert")}
  if(k==="pos"){const i=f.dataset.i;const o={lid:d.lid,bez:d.bez.trim(),menge:pnum(d.menge),preis:pnum(d.preis),mwst:pnum(d.mwst),rabatt:pnum(d.rabatt)};const rf=$('form[data-form="rechnung"]');if(rf)readRechnung(rf);if(i!==""&&i!==undefined)draft.pos[+i]=o;else draft.pos.push(o);closeSheet();render()}
  if(k==="rechnung"){readRechnung(f);if(commitRechnung()){render();toast("Gespeichert, Rechnung "+draft.nr)}}
  if(k==="paid"){draft.bezahlt=d.datum;draft.zahlart=d.art;closeSheet();if(!draft.neu)persistDraft();render();toast("Zahlung gebucht")}
  if(k==="praxis"){mutate(db=>{["name","inhaber","strasse","plz","ort","telefon","email","steuernr","bank","iban","bic","fusszeile"].forEach(n=>db.praxis[n]=d[n]||"");db.praxis.ziel=parseInt(d.ziel)||14;db.praxis.kleinunternehmer=!!d.kleinunternehmer});render();toast("Gespeichert")}
  if(k==="pin"){const h=await hash(d.pin);mutate(db=>db.praxis.pinHash=h);closeSheet();render();toast("Code festgelegt")}
});
async function hash(s){try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("fp:"+s));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,"0")).join("")}catch(_){return "x:"+btoa(s)}}
function lock(){$("#layer").innerHTML=`<div class="lock"><form class="card" data-form="unlock"><h2 style="margin-top:0">${esc(DB.praxis.name)}</h2><p class="sub">Bitte Code eingeben</p><input name="pin" type="password" inputmode="numeric" autocomplete="off" autofocus aria-label="Code"><button class="btn primary" style="width:100%" type="submit">Entsperren</button><p id="lerr" class="sub" style="color:var(--bad)" role="alert"></p></form></div>`}
document.addEventListener("submit",async e=>{if(e.target.dataset.form!=="unlock")return;e.preventDefault();const h=await hash(new FormData(e.target).get("pin"));if(h===DB.praxis.pinHash){closeSheet()}else{$("#lerr").textContent="Falscher Code";e.target.reset()}},true);
let hideT=0;document.addEventListener("visibilitychange",()=>{if(document.hidden)hideT=Date.now();else if(DB&&DB.praxis.pinHash&&Date.now()-hideT>60000)lock()});

/* ---------- Start ---------- */
(async()=>{
  DB=(await store.get())||DEFAULT();
  DB.rechnungen.forEach(r=>{r.pos=r.pos||[]});
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(_){}
  render();if(DB.praxis.pinHash)lock();
  try{if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js")}catch(_){}
})();
</script>
