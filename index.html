<style>

:root{

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1719; --panel:#172326; --fg:#e8f0f0; --muted:#90a6aa; --line:#2a3b3f;
  --accent:#4fc0bb; --accent-fg:#052321; --accent-soft:#17383a;
  --good:#6fd39a; --warn:#f0b655; --bad:#ff8f86; --bad-soft:#412321; --warn-soft:#41330f; --good-soft:#173826; color-scheme:dark}}
:root[data-theme="dark"]{

  --accent:#4fc0bb; --accent-fg:#052321; --accent-soft:#17383a;
  --good:#6fd39a; --warn:#f0b655; --bad:#ff8f86; --bad-soft:#412321; --warn-soft:#41330f; --good-soft:#173826; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 var(--font);-webkit-text-size-adjust:100%;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
#app{display:flex;min-height:100%}
nav.side{width:210px;flex:none;background:var(--panel);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow:auto}
nav.side .brand{font-weight:700;font-size:17px;padding:4px 10px 14px;line-height:1.2}
nav.side .brand small{display:block;font-weight:400;color:var(--muted);font-size:12px;margin-top:2px}
nav.side button{display:flex;align-items:center;gap:10px;text-align:left;border:0;background:none;padding:12px 12px;border-radius:10px;min-height:var(--tap);cursor:pointer;color:var(--fg)}
nav.side button[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:650}
nav.side .grow{flex:1}
.logo-side{display:block;max-width:100%;max-height:64px;object-fit:contain;margin:0 0 8px}
.logo-top{text-align:center;margin:0 0 18px}.logo-top img{max-width:60%;max-height:110px;object-fit:contain}
.logo-prev{max-width:240px;max-height:110px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px;display:block;margin:0 0 12px}
main{flex:1;min-width:0;max-width:980px;margin:0 auto;padding:22px max(16px,env(safe-area-inset-left,0px)) 90px max(16px,env(safe-area-inset-right,0px))}
h1{font-size:26px;margin:0 0 4px;letter-spacing:-.01em}
h2{font-size:18px;margin:26px 0 10px}
.sub{color:var(--muted);margin:0 0 18px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:14px 0}
.bar .spacer{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:var(--tap);padding:0 18px;border-radius:10px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-weight:600}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.small{min-height:38px;padding:0 12px;font-size:14px}
.btn:disabled{opacity:.5}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,nav button:focus-visible,.row:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.list{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.row{display:flex;gap:12px;align-items:center;padding:13px 16px;border-bottom:1px solid var(--line);min-height:56px;cursor:pointer}
.row:last-child{border-bottom:0}
.row .main{flex:1;min-width:0}
.row .t{font-weight:600;overflow-wrap:anywhere}
.row .s{color:var(--muted);font-size:14px;overflow-wrap:anywhere}
.row .amt{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.empty{padding:26px 16px;color:var(--muted);text-align:center}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12.5px;font-weight:650;background:var(--accent-soft);color:var(--accent)}
.pill.good{background:var(--good-soft);color:var(--good)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin:14px 0}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.stat .k{color:var(--muted);font-size:13.5px}.stat .v{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
form .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:14px;color:var(--muted);min-width:0}
label.f.wide{grid-column:1/-1}
label.f input,label.f select,label.f textarea{min-height:var(--tap);border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--bg);color:var(--fg);font-size:16px;width:100%;min-width:0}
label.f textarea{min-height:90px;resize:vertical}
label.chk{display:flex;gap:10px;align-items:center;min-height:var(--tap)}
label.chk input{width:22px;height:22px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:13px;color:var(--muted);font-weight:600}
td.r,th.r{text-align:right;white-space:nowrap}
.tot td{font-weight:700;border-top:2px solid var(--fg)}
.note{padding:12px 14px;border-radius:10px;background:var(--warn-soft);color:var(--fg);font-size:14.5px;margin:12px 0}
.note.ok{background:var(--good-soft)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:12px 18px;border-radius:12px;z-index:60;max-width:90vw}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--panel);width:min(640px,100%);max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px))}
@media(min-width:700px){.sheet-bg{align-items:center}.sheet{border-radius:18px}}
.lock{position:fixed;inset:0;background:var(--bg);z-index:80;display:flex;align-items:center;justify-content:center;padding:20px}
.lock .card{width:min(360px,100%);text-align:center}
.lock input{text-align:center;font-size:26px;letter-spacing:.4em;width:100%;min-height:56px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin:14px 0}
.tabs{display:none}
@media(max-width:820px){
  nav.side{display:none}
  .tabs{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);z-index:30;padding:6px max(6px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px))}
  .tabs button{flex:1;border:0;background:none;padding:8px 2px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:52px;color:var(--muted);cursor:pointer}
  .tabs button[aria-current="page"]{color:var(--accent);font-weight:700}
  .tabs svg{width:22px;height:22px}
}
nav svg{width:20px;height:20px;flex:none}

/* Termine, Befund, Fotos, GiroCode */
.zeit{min-width:54px;font-weight:700;font-variant-numeric:tabular-nums}
.row.off{opacity:.6}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
a.btn{text-decoration:none;color:inherit}
.dp{min-height:38px;border:1px solid var(--line);border-radius:10px;padding:0 10px;background:var(--panel)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative;display:inline-block}
.chip input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.chip span{display:inline-block;padding:8px 13px;border:1px solid var(--line);border-radius:99px;background:var(--bg);min-height:40px;line-height:22px}
.chip input:checked+span{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:600}
.chip input:focus-visible+span{outline:3px solid var(--accent);outline-offset:2px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-bottom:10px}
.th{position:relative;display:flex;flex-direction:column;gap:4px}
.th img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;cursor:zoom-in;border:1px solid var(--line)}
.th select{min-height:38px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.th .x{position:absolute;top:4px;right:4px;width:34px;height:34px;border-radius:99px;border:0;background:rgba(0,0,0,.65);color:#fff;cursor:pointer}
.rowth{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.rowth img{width:52px;height:52px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:zoom-in}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:90;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px;color:#fff;cursor:zoom-out}
.lb img{max-width:100%;max-height:88%;object-fit:contain}
.payrow{display:flex;gap:18px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap}
.payrow p{flex:1;min-width:200px}
.giro{text-align:center;color:#111}.giro svg{display:block;margin:0 auto 2px}

:root{--s1:#257de0;--s2:#f47230}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--s1:#338ced;--s2:#e76624}}
:root[data-theme="dark"]{--s1:#338ced;--s2:#e76624}
.more{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.mbtn{display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px 8px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);min-height:96px;cursor:pointer;font-weight:600;color:var(--fg)}
.mbtn svg{width:28px;height:28px;color:var(--accent)}
.sig{display:block;width:100%;max-width:520px;height:170px;border:1px dashed #888;border-radius:8px;background:#fff;touch-action:none;cursor:crosshair}
.lg{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;margin:0 0 8px}
.lg i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.chart{width:100%;height:auto;display:block}
.paper table.sm{font-size:12px}.paper table.sm th,.paper table.sm td{padding:6px 6px}

.paper{background:#fff;color:#111;border:1px solid var(--line);border-radius:6px;padding:28px 30px;font-size:14px;line-height:1.4;max-width:800px;margin:0 auto}

.paper table th{color:#444;border-bottom:1px solid #999}.paper td{border-bottom:1px solid #ddd}

.paper small{color:#444}

		for (var x = 0; x < ecdata[r].length; x++) {
            var modIndex = x + modPoly.getLength() - ecdata[r].length;
			ecdata[r][x] = (modIndex >= 0)? modPoly.get(modIndex) : 0;
		}

	}
	
	var totalCodeCount = 0;
	for (var y = 0; y < rsBlocks.length; y++) {
		totalCodeCount += rsBlocks[y].totalCount;
	}

	var data = new Array(totalCodeCount);
	var index = 0;

	for (var z = 0; z < maxDcCount; z++) {
		for (var s = 0; s < rsBlocks.length; s++) {
			if (z < dcdata[s].length) {
				data[index++] = dcdata[s][z];
			}
		}
	}

	for (var xx = 0; xx < maxEcCount; xx++) {
		for (var t = 0; t < rsBlocks.length; t++) {
			if (xx < ecdata[t].length) {
				data[index++] = ecdata[t][xx];
			}
		}
	}

	return data;

};

module.exports = QRCode;
};
window.__QR=__r('index');})();

/* ---------- Auswertung ---------- */
function auswertung(y){
  const inc=DB.rechnungen.filter(r=>!r.storno&&r.bezahlt&&r.bezahlt.startsWith(String(y))).sort((a,b)=>a.bezahlt<b.bezahlt?-1:1);
  const out=DB.ausgaben.filter(a=>a.datum.startsWith(String(y))).sort((a,b)=>a.datum<b.datum?-1:1);
  const eB=r2(inc.reduce((s,r)=>s+sums(r).brutto,0)),eM=r2(inc.reduce((s,r)=>s+sums(r).mwst,0));
  const aB=r2(out.reduce((s,a)=>s+pnum(a.brutto),0)),aM=r2(out.reduce((s,a)=>s+r2(pnum(a.brutto)*pnum(a.mwst)/(100+pnum(a.mwst))),0));
  const mon=Array.from({length:12},(_,i)=>({m:i+1,e:0,a:0}));
  inc.forEach(r=>mon[+r.bezahlt.slice(5,7)-1].e+=sums(r).brutto);out.forEach(a=>mon[+a.datum.slice(5,7)-1].a+=pnum(a.brutto));
  const kat={};out.forEach(a=>kat[a.kat]=(kat[a.kat]||0)+pnum(a.brutto));
  return{inc,out,eB,eM,aB,aM,mon,kat,eN:r2(eB-eM),aN:r2(aB-aM)}}
function vAuswertung(){const y=ui.year,A=auswertung(y),ku=DB.praxis.kleinunternehmer;
  const ue=ku?r2(A.eB-A.aB):r2(A.eN-A.aN);
  const years=[...new Set([new Date().getFullYear(),...DB.rechnungen.map(r=>+r.datum.slice(0,4)),...DB.ausgaben.map(a=>+a.datum.slice(0,4))])].sort().reverse();
  const MN=["Jan","Feb","Mär","Apr","Mai","Jun","Jul","Aug","Sep","Okt","Nov","Dez"];
  return `<h1>Auswertung für das Finanzamt</h1><p class="sub">Einnahmen nach Zahlungsdatum, Ausgaben nach Belegdatum (Einnahmen-Überschuss-Rechnung).</p>
  <div class="bar"><label class="f" style="flex-direction:row;align-items:center;gap:10px">Jahr <select id="yr" style="min-height:var(--tap);border:1px solid var(--line);border-radius:10px;padding:0 12px;background:var(--panel)">${years.map(v=>`<option ${v===y?"selected":""}>${v}</option>`).join("")}</select></label><span class="spacer"></span><button class="btn" data-act="copyAusw">Zahlen kopieren</button></div>
  <div class="stats"><div class="stat"><div class="k">Einnahmen</div><div class="v">${eur(ku?A.eB:A.eN)}</div></div><div class="stat"><div class="k">Ausgaben</div><div class="v">${eur(ku?A.aB:A.aN)}</div></div><div class="stat"><div class="k">Überschuss (Gewinn)</div><div class="v" style="color:${ue<0?"var(--bad)":"var(--good)"}">${eur(ue)}</div></div></div>
  ${ku?"":`<p class="sub">Beträge netto, ohne Umsatzsteuer. Brutto Einnahmen ${eur(A.eB)}, enthaltene Umsatzsteuer ${eur(A.eM)}; Ausgaben brutto ${eur(A.aB)}, Vorsteuer ${eur(A.aM)}.</p>`}
  <h2>Einnahmen und Ausgaben je Monat</h2><div class="card"><div class="lg"><span><i style="background:var(--s1)"></i>Einnahmen</span><span><i style="background:var(--s2)"></i>Ausgaben</span><span style="color:var(--muted)">Beträge brutto in €</span></div>${A.mon.some(m=>m.e||m.a)?chartMon(A.mon):'<div class="empty">Noch keine Daten für dieses Jahr.</div>'}</div>
  <h2>Nach Quartal</h2><div class="card tw"><table><thead><tr><th>Quartal</th><th class="r">Einnahmen</th><th class="r">Ausgaben</th><th class="r">Saldo</th></tr></thead><tbody>${[0,1,2,3].map(i=>{const q=A.mon.slice(i*3,i*3+3),e=r2(q.reduce((x,m)=>x+m.e,0)),a=r2(q.reduce((x,m)=>x+m.a,0));return `<tr><td>${i+1}. Quartal</td><td class="r">${num(e)}</td><td class="r">${num(a)}</td><td class="r">${num(r2(e-a))}</td></tr>`}).join("")}</tbody></table></div>
  <h2>Nach Monat</h2><div class="card tw"><table><thead><tr><th>Monat</th><th class="r">Einnahmen</th><th class="r">Ausgaben</th><th class="r">Saldo</th></tr></thead><tbody>${A.mon.map(m=>`<tr><td>${MN[m.m-1]}</td><td class="r">${num(m.e)}</td><td class="r">${num(m.a)}</td><td class="r">${num(r2(m.e-m.a))}</td></tr>`).join("")}<tr class="tot"><td>Summe</td><td class="r">${num(A.eB)}</td><td class="r">${num(A.aB)}</td><td class="r">${num(r2(A.eB-A.aB))}</td></tr></tbody></table></div>
  <h2>Ausgaben nach Kategorie</h2><div class="card tw"><table><tbody>${Object.keys(A.kat).length?Object.entries(A.kat).map(([k,v])=>`<tr><td>${esc(k)}</td><td class="r">${num(v)}</td></tr>`).join(""):'<tr><td class="empty">Keine Ausgaben.</td></tr>'}</tbody></table></div>
  <h2>Export für den Steuerberater</h2><div class="card"><p class="sub" style="margin-top:0">Tabellen im CSV-Format (öffnen mit Excel oder Numbers). Sie enthalten keine Patientennamen.</p><div class="bar" style="margin:0"><button class="btn" data-act="csvEin">Einnahmen ${y}</button><button class="btn" data-act="csvAus">Ausgaben ${y}</button><button class="btn" data-act="csvKasseJ">Kassenbuch ${y}</button><button class="btn" data-act="csvAusw">Alles zusammen</button></div></div>
  <h2>Einzelnachweis Einnahmen</h2><div class="card tw"><table><thead><tr><th>Bezahlt am</th><th>Rechnung</th><th>Zahlart</th><th class="r">Betrag</th></tr></thead><tbody>${A.inc.map(r=>`<tr><td>${dt(r.bezahlt)}</td><td>${esc(r.nr)}</td><td>${esc(r.zahlart||"")}</td><td class="r">${num(sums(r).brutto)}</td></tr>`).join("")||'<tr><td colspan="4" class="empty">Keine Einnahmen.</td></tr>'}</tbody></table></div>`}
function csvAusw(){const A=auswertung(ui.year);const rows=[["Typ","Datum","Beleg","Beschreibung","Kategorie","Brutto"]];
  A.inc.forEach(r=>rows.push(["Einnahme",r.bezahlt,r.nr,"Rechnung",r.zahlart||"",num(sums(r).brutto)]));
  A.out.forEach(a=>rows.push(["Ausgabe",a.datum,a.beleg||"",a.beschr||"",a.kat,num(pnum(a.brutto))]));
  return rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(";")).join("\n")}

function sheet(html,title){$("#layer").innerHTML=`<div class="sheet-bg" data-act="bg"><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title||"")}"><h2 style="margin-top:0">${esc(title||"")}</h2>${html}</div></div>`;const f=$("#layer input:not([type=checkbox]):not([type=date]),#layer select");if(f&&matchMedia("(min-width:700px)").matches)f.focus()}
const closeSheet=()=>{$("#layer").innerHTML=""};
function confirmBox(text,ok,cb){sheet(`<p>${esc(text)}</p><div class="bar"><button class="btn danger" data-act="yes">${esc(ok)}</button><button class="btn" data-act="closeSheet">Abbrechen</button></div>`,"Bitte bestätigen");$("#layer").querySelector('[data-act="yes"]').onclick=()=>{closeSheet();cb()}}
function download(name,text,type){
  try{const b=new Blob([text],{type});const u=URL.createObjectURL(b);const a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}catch(e){}
  sheet(`<p class="sub">Falls kein Download startet (zum Beispiel in der Vorschau), kopieren Sie den Text und fügen ihn in eine Notiz oder E-Mail ein.</p><textarea id="dl" readonly style="width:100%;min-height:200px;font:13px monospace;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:10px">${esc(text)}</textarea><div class="bar"><button class="btn primary" data-act="copyDl">Alles kopieren</button><button class="btn" data-act="closeSheet">Schließen</button></div>`,name)}
async function copy(t){try{await navigator.clipboard.writeText(t);toast("Kopiert");return true}catch(e){const el=$("#dl");if(el){el.select();toast("Bitte markierten Text manuell kopieren")}else{toast("Kopieren nicht möglich")}return false}}


/* ---------- GiroCode (EPC-QR) ---------- */
function qrSvg(t){try{const Q=window.__QR,b=unescape(encodeURIComponent(t));let q=null;for(let v=1;v<=40&&!q;v++){try{const x=new Q(v,0);x.addData(b);x.make();q=x}catch(_){}}
  if(!q)return"";const n=q.getModuleCount(),z=4;let d="";for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))d+=`M${c+z},${r+z}h1v1h-1z`;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${n+2*z} ${n+2*z}" width="132" height="132" shape-rendering="crispEdges" role="img" aria-label="GiroCode"><rect width="100%" height="100%" fill="#fff"/><path d="${d}" fill="#000"/></svg>`}catch(_){return""}}
function epcText(r,s){const P=DB.praxis,iban=(P.iban||"").replace(/\s+/g,"").toUpperCase();
  if(!/^[A-Z]{2}\d{2}[A-Z0-9]{11,30}$/.test(iban)||r.bezahlt||r.storno||s.brutto<=0)return"";
  const bic=(P.bic||"").replace(/\s+/g,"").toUpperCase(),name=(P.kontoinhaber||P.inhaber||P.name||"").slice(0,70);
  return ["BCD","002","1","SCT",bic,name,iban,"EUR"+s.brutto.toFixed(2),"","","Rechnung "+r.nr].join("\n")}
function girocode(r,s){const t=epcText(r,s);if(!t)return"";const svg=qrSvg(t);return svg?`<div class="giro">${svg}<small>GiroCode: mit der Banking-App scannen</small></div>`:""}

function initSig(){const c=$("#sig");if(!c)return;const r=c.getBoundingClientRect(),k=window.devicePixelRatio||1;c.width=Math.round(r.width*k);c.height=Math.round(r.height*k);const x=c.getContext("2d");x.scale(k,k);x.lineWidth=2.4;x.lineCap="round";x.lineJoin="round";x.strokeStyle="#111";sig.n=0;sig.down=false}
document.addEventListener("pointerdown",e=>{if(e.target.id!=="sig")return;e.preventDefault();const c=e.target;try{c.setPointerCapture(e.pointerId)}catch(_){}const r=c.getBoundingClientRect();sig.down=true;sig.x=e.clientX-r.left;sig.y=e.clientY-r.top;const x=c.getContext("2d");x.beginPath();x.moveTo(sig.x,sig.y);x.lineTo(sig.x+.1,sig.y);x.stroke();sig.n++});

function niceStep(x){const p=Math.pow(10,Math.floor(Math.log10(x||1))),f=x/p;return(f<=1?1:f<=2?2:f<=5?5:10)*p}
function chartMon(mon){const W=640,H=250,L=52,R=8,T=10,B=28,pw=W-L-R,ph=H-T-B,mx=Math.max(1,...mon.map(m=>Math.max(m.e,m.a))),step=niceStep(mx/4),top=step*Math.ceil(mx/step),y=v=>T+ph-(v/top)*ph;let g="";
  for(let v=0;v<=top+1e-9;v+=step)g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${Math.round(v).toLocaleString("de-DE")}</text>`;
  const gw=pw/12,bw=Math.min(14,gw*.34),bar=(x,v,c,tt)=>{if(v<=0)return"";const h=Math.max(2,(v/top)*ph),r=Math.min(4,h/2,bw/2),y0=T+ph;return `<path d="M${x},${y0}v${-(h-r)}a${r},${r} 0 0 1 ${r},${-r}h${bw-2*r}a${r},${r} 0 0 1 ${r},${r}v${h-r}z" fill="${c}"><title>${tt}</title></path>`};
  mon.forEach((m,i)=>{const cx=L+gw*i+gw/2;g+=bar(cx-bw-1,m.e,"var(--s1)",`${MON[i]}: Einnahmen ${num(m.e)} €`)+bar(cx+1,m.a,"var(--s2)",`${MON[i]}: Ausgaben ${num(m.a)} €`)+`<text x="${cx}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--muted)">${MON[i]}</text>`});
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Einnahmen und Ausgaben je Monat">${g}</svg>`}
function csvEin(y){const A=auswertung(y),rows=[["Bezahlt am","Rechnungsnr.","Rechnungsdatum","Zahlart","Netto","MwSt","Brutto"]];A.inc.forEach(r=>{const s=sums(r);rows.push([r.bezahlt,r.nr,r.datum,r.zahlart||"",num(s.netto),num(s.mwst),num(s.brutto)])});return rows}
function csvAus(y){const A=auswertung(y),rows=[["Datum","Beleg-Nr.","Beschreibung","Lieferant","Kategorie","Netto","MwSt-Satz %","Vorsteuer","Brutto"]];A.out.forEach(a=>{const b=pnum(a.brutto),m=r2(b*pnum(a.mwst)/(100+pnum(a.mwst)));rows.push([a.datum,a.beleg||"",a.beschr||"",a.lief||"",a.kat,num(r2(b-m)),num(pnum(a.mwst)),num(m),num(b)])});return rows}
function csvKasse(von,bis){const R=kasseRun(von,bis),rows=[["Datum","Text","Beleg","Betrag","Saldo"],["","Anfangsbestand","",""  ,num(R.start)]];R.lines.forEach(l=>rows.push([l.datum,(l.auto?l.text.replace(/ · .*$/," (Rechnung)"):l.text),l.beleg,num(l.betrag),num(l.saldo)]));rows.push(["","Endbestand","","",num(R.end)]);return rows}

function loadLogo(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{const m=700,k=Math.min(1,m/Math.max(im.width,im.height)),w=Math.round(im.width*k),h=Math.round(im.height*k),c=document.createElement("canvas");c.width=w;c.height=h;const x=c.getContext("2d");x.drawImage(im,0,0,w,h);URL.revokeObjectURL(u);let png=c.toDataURL("image/png");if(png.length>400000){x.globalCompositeOperation="destination-over";x.fillStyle="#fff";x.fillRect(0,0,w,h);png=c.toDataURL("image/jpeg",.85)}res(png)};im.onerror=()=>{URL.revokeObjectURL(u);rej()};im.src=u})}

function persistDraft(){const r=JSON.parse(JSON.stringify(draft));delete r.neu;mutate(d=>{const i=d.rechnungen.findIndex(x=>x.id===r.id);if(i>=0)d.rechnungen[i]=r;else d.rechnungen.push(r)})}
async function saveDraftFromForm(){const f=$('form[data-form="rechnung"]');if(!f||draft.bezahlt||draft.storno)return true;if(!f.reportValidity())return false;readRechnung(f);return commitRechnung()}
function readRechnung(f){const d=new FormData(f);if(d.has("patient"))draft.patient=d.get("patient")||draft.patient;if(d.get("datum"))draft.datum=d.get("datum");if(d.has("leistdat"))draft.leistdat=d.get("leistdat")||draft.leistdat;if(d.has("ziel"))draft.ziel=Math.max(0,parseInt(d.get("ziel"))||0);if(d.has("hinweis"))draft.hinweis=d.get("hinweis")||""}
function commitRechnung(){if(!draft.patient){toast("Bitte einen Patienten wählen");return false}if(!draft.pos.length){toast("Bitte mindestens eine Position hinzufügen");return false}
  if(draft.neu){draft.nr=naechsteNr(draft.datum.slice(0,4));}
  const beh=draft.beh||[];persistDraft();if(draft.neu){mutate(d=>d.behandlungen.forEach(b=>{if(beh.includes(b.id))b.rechnung=draft.id}));draft.neu=false}return true}

  if(k==="art"){const id=f.dataset.id;mutate(db=>{const o={bez:d.bez.trim(),einheit:d.einheit,min:pnum(d.min),lief:d.lief||"",notiz:d.notiz||""},b=pnum(d.bestand);

    else{o.id=uid();o.bestand=b;db.artikel.push(o);if(b)db.lagerlog.push({id:uid(),artikel:o.id,datum:today(),menge:b,notiz:"Anfangsbestand"})}});closeSheet();render();toast("Gespeichert")}
  if(k==="bew"){const id=f.dataset.id,dir=f.dataset.dir,m=pnum(d.menge);const a=DB.artikel.find(x=>x.id===id);if(m<=0){toast("Bitte eine Menge eingeben");return}
    if(dir==="-"&&m>pnum(a.bestand)){toast("So viel ist nicht auf Lager");return}
    mutate(db=>{const ar=db.artikel.find(x=>x.id===id);ar.bestand=r2(pnum(ar.bestand)+(dir==="+"?m:-m));db.lagerlog.push({id:uid(),artikel:id,datum:d.datum,menge:dir==="+"?m:-m,notiz:d.notiz||""});
      if(dir==="+"){if(d.lief)ar.lief=d.lief;if(d.alsAusg&&pnum(d.brutto)>0)db.ausgaben.push({id:uid(),datum:d.datum,beleg:d.beleg||"",beschr:"Wareneinkauf: "+ar.bez+" ("+numShort(m)+" "+ar.einheit+")",lief:d.lief||"",kat:"Material / Verbrauch",brutto:pnum(d.brutto),mwst:db.praxis.kleinunternehmer?0:19})}});
    closeSheet();render();toast(dir==="+"&&d.alsAusg&&pnum(d.brutto)>0?"Zugang gebucht und als Ausgabe erfasst":"Gebucht")}
  if(k==="ger"){const id=f.dataset.id;mutate(db=>{const o={bez:d.bez.trim(),typ:d.typ||"",seriennr:d.seriennr||"",kauf:d.kauf||"",intervall:parseInt(d.intervall)||0,letzte:d.letzte||""};if(id)Object.assign(db.geraete.find(x=>x.id===id),o);else{o.id=uid();db.geraete.push(o)}});closeSheet();render();toast("Gespeichert")}
  if(k==="hyg"){const id=f.dataset.id;mutate(db=>{const o={datum:d.datum,zeit:d.zeit||"",art:d.art,geraet:d.geraet||"",charge:d.charge||"",programm:d.programm||"",instr:d.instr||"",ergebnis:d.ergebnis,von:d.von||"",notiz:d.notiz||""};if(id)Object.assign(db.hygiene.find(x=>x.id===id),o);else{o.id=uid();db.hygiene.push(o)}
    if(o.art==="Wartung / Prüfung Gerät"&&o.geraet){const g=db.geraete.find(x=>x.id===o.geraet);if(g&&(!g.letzte||o.datum>=g.letzte))g.letzte=o.datum}});closeSheet();render();toast("Eintrag gespeichert")}
  if(k==="kasse"){const id=f.dataset.id;mutate(db=>{const o={datum:d.datum,art:d.art,text:d.text||"",betrag:Math.abs(pnum(d.betrag)),beleg:d.beleg||""};
    if(id){const x=db.kasse.find(z=>z.id===id);Object.assign(x,o);const ag=x.ausgId&&db.ausgaben.find(z=>z.id===x.ausgId);if(ag)Object.assign(ag,{datum:o.datum,beleg:o.beleg,beschr:o.text,brutto:o.betrag})}
    else{o.id=uid();if(o.art==="ausgabe"&&d.alsAusg){const aid=uid();o.ausgId=aid;db.ausgaben.push({id:aid,datum:o.datum,beleg:o.beleg,beschr:o.text||"Barausgabe",lief:"",kat:d.kat||"Sonstiges",brutto:o.betrag,mwst:db.praxis.kleinunternehmer?0:19})}db.kasse.push(o)}});closeSheet();render();toast("Buchung gespeichert")}
  if(k==="kasseAnf"){mutate(db=>db.praxis.kasseAnfang=pnum(d.b));closeSheet();render()}
  if(k==="termin"){const id=f.dataset.id;mutate(db=>{const o={patient:d.patient,datum:d.datum,zeit:d.zeit||"",dauer:parseInt(d.dauer)||45,wdh:parseInt(d.wdh)||0,notiz:d.notiz||""};if(id)Object.assign(db.termine.find(t=>t.id===id),o);else{o.id=uid();o.status="geplant";db.termine.push(o)}});if(ui.view==="termine")ui.day=d.datum;closeSheet();render();toast("Termin gespeichert")}
  if(k==="befund"){const id=f.dataset.id,pid=f.dataset.pid,m=new FormData(f).getAll("m");mutate(db=>{const o={patient:pid,datum:d.datum,merk:m,notiz:d.notiz||"",massn:d.massn||"",empf:d.empf||"",fotos:befFotos.map(x=>({id:x.id||uid(),d:x.d,cap:x.cap||"Befund"}))};if(id)Object.assign(db.befunde.find(b=>b.id===id),o);else{o.id=uid();db.befunde.push(o)}});closeSheet();render();toast("Befund gespeichert")}
  if(k==="beh"){const id=f.dataset.id,pid=f.dataset.pid;const leistIds=DB.leistungen.filter(l=>d["l_"+l.id]).map(l=>l.id);
    mutate(db=>{const o={datum:d.datum,km:d.km,leist:leistIds,notiz:d.notiz,patient:pid};if(id)Object.assign(db.behandlungen.find(b=>b.id===id),o);else{o.id=uid();db.behandlungen.push(o)}});const fo=f.dataset.tid?finishTermin(f.dataset.tid):"";closeSheet();render();toast(fo?"Gespeichert. Folgetermin am "+dt(fo):"Gespeichert")}
  if(k==="leist"){const id=f.dataset.id;mutate(db=>{const o={bez:d.bez.trim(),preis:pnum(d.preis),einheit:d.einheit,mwst:pnum(d.mwst),aktiv:!!d.aktiv};if(id)Object.assign(db.leistungen.find(l=>l.id===id),o);else{o.id=uid();db.leistungen.push(o)}});closeSheet();render();toast("Gespeichert")}
  if(k==="ausg"){const id=f.dataset.id;mutate(db=>{const o={datum:d.datum,beleg:d.beleg,beschr:d.beschr,lief:d.lief,kat:d.kat,brutto:pnum(d.brutto),mwst:pnum(d.mwst)};if(id)Object.assign(db.ausgaben.find(a=>a.id===id),o);else{o.id=uid();db.ausgaben.push(o)}});closeSheet();render();toast("Gespeichert")}
  if(k==="pos"){const i=f.dataset.i;const o={lid:d.lid,bez:d.bez.trim(),menge:pnum(d.menge),preis:pnum(d.preis),mwst:pnum(d.mwst),rabatt:pnum(d.rabatt)};const rf=$('form[data-form="rechnung"]');if(rf)readRechnung(rf);if(i!==""&&i!==undefined)draft.pos[+i]=o;else draft.pos.push(o);closeSheet();render()}
  if(k==="rechnung"){readRechnung(f);if(commitRechnung()){render();toast("Gespeichert, Rechnung "+draft.nr)}}
  if(k==="paid"){draft.bezahlt=d.datum;draft.zahlart=d.art;closeSheet();if(!draft.neu)persistDraft();render();toast("Zahlung gebucht")}
  if(k==="praxis"){mutate(db=>{["name","inhaber","strasse","plz","ort","telefon","email","steuernr","bank","iban","bic","kontoinhaber","fusszeile"].forEach(n=>db.praxis[n]=d[n]||"");db.praxis.einwText=(d.einwText||"").trim()===EINW_TEXT?"":(d.einwText||"").trim();db.praxis.ziel=parseInt(d.ziel)||14;db.praxis.kleinunternehmer=!!d.kleinunternehmer});render();toast("Gespeichert")}
  if(k==="pin"){const h=await hash(d.pin);mutate(db=>db.praxis.pinHash=h);closeSheet();render();toast("Code festgelegt")}
});
async function hash(s){try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("fp:"+s));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,"0")).join("")}catch(_){return "x:"+btoa(s)}}
function lock(){$("#layer").innerHTML=`<div class="lock"><form class="card" data-form="unlock"><h2 style="margin-top:0">${esc(DB.praxis.name)}</h2><p class="sub">Bitte Code eingeben</p><input name="pin" type="password" inputmode="numeric" autocomplete="off" autofocus aria-label="Code"><button class="btn primary" style="width:100%" type="submit">Entsperren</button><p id="lerr" class="sub" style="color:var(--bad)" role="alert"></p></form></div>`}
document.addEventListener("submit",async e=>{if(e.target.dataset.form!=="unlock")return;e.preventDefault();const h=await hash(new FormData(e.target).get("pin"));if(h===DB.praxis.pinHash){closeSheet()}else{$("#lerr").textContent="Falscher Code";e.target.reset()}},true);
let hideT=0;document.addEventListener("visibilitychange",()=>{if(document.hidden)hideT=Date.now();else if(DB&&DB.praxis.pinHash&&Date.now()-hideT>60000)lock()});

/* ---------- Start ---------- */
(async()=>{
  DB=(await store.get())||DEFAULT();
  fixDB();
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(_){}
  render();if(DB.praxis.pinHash)lock();
  try{if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js")}catch(_){}
})();
</script>
